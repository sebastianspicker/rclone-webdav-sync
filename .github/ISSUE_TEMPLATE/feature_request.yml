name: Feature request
description: Propose a new command, option, or behavior change
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that `sciebo` doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The command, option, or setting you have in mind, and roughly how it would behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this, including doing it outside this tool (a filter, a cron job, a different rclone flag).
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Is this specific to sciebo (Hochschulcloud.NRW) or general to any Nextcloud server?
      description: Some behavior (etiquette limits, chunk sizes) is tuned for sciebo (Hochschulcloud.NRW) specifically; other features apply to any Nextcloud server.
      options:
        - Specific to sciebo (Hochschulcloud.NRW)
        - Any Nextcloud server
        - Not sure
    validations:
      required: true
