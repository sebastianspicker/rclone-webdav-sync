name: Bug report
description: Something broke or behaved differently than documented
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before you paste anything, remove credentials,
        private sciebo URLs, and unredacted `rclone.conf` contents.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran, plus the relevant output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`sciebo doctor` output (redacted)"
      description: Running `bin/sciebo doctor` gives a lot of context. Paste it here after removing anything private.
      render: shell
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "macOS version, rclone version (`rclone version`), and bash version (`bash --version | head -1`)."
    validations:
      required: true
