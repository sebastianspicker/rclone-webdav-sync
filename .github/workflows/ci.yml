name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install bash shellcheck shfmt rclone

      - name: Bash version
        run: bash --version | head -1

      - name: Version consistency
        run: |
          test -f VERSION
          expected="$(cat VERSION)"
          actual="$(bin/sciebo --version | awk '{print $2}')"
          test "$expected" = "$actual"
          bin/sciebo --version

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Packaging smoke
        run: |
          make install PREFIX="$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/sciebo" --version
          make dist
          test -f "dist/rclone-webdav-sync-$(cat VERSION).tar.gz"

  lint-and-test-linux:
    # Bash 5.3 on Linux: proves the CLI does not depend on macOS-only bash
    # behavior. The portable integration suite has its own job below.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Bash 5.3
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" 2>/dev/null || true
          brew install bash
          echo "$(brew --prefix)/bin" >>"$GITHUB_PATH"
          "$(brew --prefix)/bin/bash" --version | head -1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates unzip xz-utils
          # Ubuntu's shellcheck (0.9) crashes on Bash 5.3 `${ cmd;}`; pin the
          # release the repo is linted with. SHA256 of the official asset.
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" |
            sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
          # Ubuntu's shfmt is too old to parse Bash 5.3 syntax (`${ cmd;}`)
          # and formats differently, so pin the release the repo is formatted
          # with. SHA256 of the official v3.14.1 release asset.
          curl -fsSL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  /tmp/shfmt" |
            sha256sum -c -
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version
          # Ubuntu's packaged rclone is older than RCLONE_MIN_VERSION (1.69).
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Version consistency
        run: |
          test -f VERSION
          expected="$(cat VERSION)"
          actual="$(bin/sciebo --version | awk '{print $2}')"
          test "$expected" = "$actual"
          bin/sciebo --version

      - name: Lint
        run: make lint

      - name: Test (fast)
        run: make test-fast

  integration-linux:
    # The integration suite is portable: platform backends are pinned through
    # the CLI's SCIEBO_* test hooks and stat/mount output has fallbacks.
    # launchd install/uninstall stays opt-in and is covered by the macOS job.
    #
    # The rclone matrix proves both ends of the documented support range:
    # "latest" (current stable, via rclone's own install.sh) and the
    # documented floor, 1.69.0 (unzipped from a pinned release download,
    # since 1.69.0 predates most distro/homebrew packages).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rclone: [latest, 1.69.0]
    steps:
      - uses: actions/checkout@v7

      - name: Install Bash 5.3
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" 2>/dev/null || true
          brew install bash
          echo "$(brew --prefix)/bin" >>"$GITHUB_PATH"
          "$(brew --prefix)/bin/bash" --version | head -1

      - name: Install rclone (latest)
        if: matrix.rclone == 'latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl ca-certificates unzip
          # Ubuntu's packaged rclone is older than the suite's
          # RCLONE_MIN_VERSION (1.69), so install the current stable release.
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Install rclone (pinned floor, 1.69.0)
        if: matrix.rclone == '1.69.0'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates unzip
          curl -fsSL -o /tmp/rclone.zip \
            https://downloads.rclone.org/v1.69.0/rclone-v1.69.0-linux-amd64.zip
          # SHA256 from https://downloads.rclone.org/v1.69.0/SHA256SUMS
          echo "813892bb54ebc5891664b85c9cfc0e05ee50d39e3d5bb1ddd6d53d0f93a64dc2  /tmp/rclone.zip" |
            sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp/rclone-extract
          sudo install -m 755 /tmp/rclone-extract/rclone-v1.69.0-linux-amd64/rclone /usr/local/bin/rclone
          rclone version

      - name: Integration
        run: bash tests/integration.sh

  integration-launchd:
    # launchd install/uninstall is opt-in because it touches the runner's
    # GUI session; run it on pushes to main only.
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      INTEGRATION_LAUNCHD: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install rclone
        run: brew install rclone
      - name: Integration with launchd install/uninstall
        run: bash tests/integration.sh
