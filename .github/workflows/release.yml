name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate and check out existing release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          selected="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$selected" origin/main
          git checkout --detach "$selected"

      - name: Install tools
        run: brew install bash shellcheck shfmt rclone

      - name: Tag matches VERSION
        run: |
          test "${RELEASE_TAG}" = "v$(cat VERSION)"

      - name: Lint
        run: |
          make lint

      - name: Build tarball
        run: make dist

      - name: Release notes from CHANGELOG
        run: |
          # The section between "## [X.Y.Z]" and the next "## [" heading.
          awk -v v="$(cat VERSION)" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            "dist/rclone-webdav-sync-$(cat VERSION).tar.gz" \
            --title "sciebo $(cat VERSION)" \
            --notes-file "$RUNNER_TEMP/notes.md"
