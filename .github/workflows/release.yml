name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install bash shellcheck shfmt rclone

      - name: Tag matches VERSION
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"

      - name: Lint and test
        run: |
          make lint
          make test

      - name: Build tarball
        run: make dist

      - name: Release notes from CHANGELOG
        run: |
          # The section between "## [X.Y.Z]" and the next "## [" heading.
          awk -v v="$(cat VERSION)" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/rclone-webdav-sync-$(cat VERSION).tar.gz" \
            --title "sciebo $(cat VERSION)" \
            --notes-file "$RUNNER_TEMP/notes.md"
