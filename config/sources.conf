# Your sync sources.
#
# One line per folder:
#
#   mode | local_path | remote_subdir [ | filter_file ]
#
#   mode           sync    upload local -> sciebo (one-way backup)
#                  pull    download sciebo -> local (one-way)
#                  bisync  two-way; run `sciebo sync --resync --apply` once
#   local_path     absolute, ~-prefixed, or relative to this project
#   remote_subdir  folder below sciebo:<REMOTE_BASE>/ (see settings.env);
#                  no leading slash, no ".."
#   filter_file    optional extra filter in config/filters/
#
# Blank lines and lines starting with # are ignored. Entry names come from
# remote_subdir and must be unique (they name logs and bisync state); run
# `sciebo doctor` if you are unsure.
#
# Before the first real run, check the plan:
#   sciebo check   (dry run)   ->   sciebo sync   (apply)
#
# Examples:
# sync|~/Projects/my-app|repos/my-app
# pull|~/Downloads/sciebo-share|shared/downloads
# bisync|~/Notes|notes|notes-extra.txt
