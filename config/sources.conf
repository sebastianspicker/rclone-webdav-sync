# Sources to sync to sciebo.
#
# Format: mode | local_path | remote_subdir [ | filter_file ]
#
#   mode          sync   local -> sciebo (one-way backup)
#                 pull   sciebo -> local (one-way download)
#                 bisync two-way (run `sciebo sync --resync --apply` once first)
#   local_path    absolute, ~-prefixed, or relative to this project
#   remote_subdir path below sciebo:<REMOTE_BASE>/ (see config/settings.env);
#                 must not be empty, absolute, or contain ".."
#   filter_file   optional extra rclone filter file in config/filters/
#
# Lines starting with # and blank lines are ignored. A line with more than
# four fields is invalid. Entry names are derived from remote_subdir
# (sanitized) and must be unique; `sciebo doctor` reports duplicates.
# Run `make check` (dry-run) before `make sync` (apply).

# sync|~/Documents|documents
# sync|~/Projects/my-app|repos/my-app
# pull|~/Downloads/sciebo-share|shared/downloads
# bisync|~/Notes|notes|notes-extra.txt
