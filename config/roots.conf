# Roots to search for git repositories.
#
# `sciebo discover` walks each root, finds folders containing a .git
# directory, and prints one source line per repository. `sciebo discover
# --write` (or `make discover`) saves them to config/sources.generated.conf.
#
#   mode | root | remote_base | maxdepth
#
#   mode         sync, pull, or bisync, applied to every repo found
#   root         folder to scan, absolute or ~-prefixed
#   remote_base  remote prefix for the repos, relative to
#                sciebo:<REMOTE_BASE>/
#   maxdepth     how deep to look for .git (default 3)
#
# Repositories nested inside other repositories are collapsed into the
# outermost one. Git only locates the folders; the contents, including .git/,
# are synced like any other files (see the Caveats section of the README).
#
# Examples:
# sync|~/Projects|repos|3
# sync|~/work|work|4
