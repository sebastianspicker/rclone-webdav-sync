# Roots for automatic git-repository discovery.
#
# Format: mode | root | remote_base | maxdepth
#
#   mode         sync, pull, or bisync (applied to every discovered repo)
#   root         directory to scan; absolute or ~-prefixed
#   remote_base  remote path prefix for discovered repos, relative to
#                sciebo:<REMOTE_BASE>/
#   maxdepth     how deep to look for .git directories (default 3)
#
# `sciebo discover --write` (`make discover`) finds repositories under
# each root and writes config/sources.generated.conf (gitignored). Repos
# nested inside other discovered repos are collapsed into the outermost
# repository. Discovery validates each assembled remote path and takes
# the run lock for --write.
# Git is only used to locate folders; contents are synced like any other
# directory (including .git/).

# sync|~/Projects|repos|3
# sync|~/work|work|4
