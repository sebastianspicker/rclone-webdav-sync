# Backup sources for `sciebo backup`, one per line:
#
#   name | local_path [ | filter_file ]
#
#   name         unique, letters/digits/dot/dash/underscore; names the
#                restic snapshots, the log, and the run record
#   local_path   absolute or ~-prefixed directory to back up
#   filter_file  optional file in the filters directory (config/filters/),
#                written in rclone filter syntax. Only exclude rules
#                ("- pattern", with a space) are supported; include (+) and
#                clear (!) rules are rejected, and the file is translated to
#                restic exclude patterns at run time.
#
# Lines starting with # and blank lines are ignored.
#
# Examples:
# projects|~/Projects|clutter.txt
# documents|~/Documents
#
# WARNING: the restic repository lives at <remote>:<BACKUP_REMOTE_PATH>
# (default "restic"), outside the sync tree REMOTE_BASE. Never point a sync
# pair at it, and never make BACKUP_REMOTE_PATH and REMOTE_BASE overlap.
