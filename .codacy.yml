---
# Codacy repository config. Keeps known false positives from coming back on
# new lines; the coding standard itself is managed in Codacy. Engine keys are
# Codacy's tool short names (docs.codacy.com, "Codacy configuration file").
exclude_paths:
  # Human security policy, not code or an agent instruction file (Agentlinter
  # flagged it; Agentlinter has no documented engine key, so exclude globally).
  - SECURITY.md
engines:
  # tools/ holds a dev-only screenshot generator: constant argv lists without
  # a shell (Bandit B404/B603, Opengrep subprocess rules) and one long
  # fixture-building function (Lizard method length). Ruff still checks it.
  bandit:
    exclude_paths:
      - tools/**
  opengrep:
    exclude_paths:
      - tools/**
  lizard:
    exclude_paths:
      - tools/**
